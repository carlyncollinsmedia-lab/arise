<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arise Reminders</title>
  <meta name="description" content="Arise reminders in their own small window. Shares the same list as the Arise app." />
  <meta name="theme-color" content="#13224A" />
  <script>
    try { var t = (JSON.parse(localStorage.getItem('arise-prototype-v1')) || {}).settings; if (t && t.theme && t.theme !== 'night') document.documentElement.dataset.theme = t.theme; } catch (e) {}
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* Same design tokens as index.html (Night sky theme, approved 26 Sept 2026). */
    :root {
      --night-900:#0B1530; --night-800:#13224A; --dawn-600:#3A5A8C; --sun-500:#F9C45A; --sun-600:#E9A93A;
      --ink-100:#F5F7FC; --ink-300:#C3CCE0; --ink-500:#8C98B8; --ink-on-sun:#1A2340;
      --line:rgba(255,255,255,.16); --radius-md:16px; --radius-pill:999px;
      --font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
    }
    /* Follows the colour theme picked in Arise (same values as index.html). */
    html[data-theme="plum"] { --night-900:#1C1030; --night-800:#2B1A45; --dawn-600:#5A3A7E; --ink-100:#F8F3FC; --ink-300:#D4C6E7; --ink-500:#A897C0; --ink-on-sun:#241338; }
    html[data-theme="forest"] { --night-900:#0D1F18; --night-800:#163228; --dawn-600:#2F5A48; --sun-500:#F2B84B; --sun-600:#DCA136; --ink-100:#F2F8F4; --ink-300:#C3DACE; --ink-500:#8FAE9F; --ink-on-sun:#10231B; }
    html[data-theme="sand"] { --night-900:#F7F0E5; --night-800:#FFFFFF; --dawn-600:#F1D3AE; --sun-500:#B4531F; --sun-600:#9A4418; --ink-100:#2A1E14; --ink-300:#6B5A48; --ink-500:#8C7A66; --ink-on-sun:#FFFFFF; --line:rgba(60,40,20,.16); }
    html[data-theme="sand"] input { color-scheme:light; background:#FFFFFF; }
    html[data-theme="sand"] .btn-secondary { border-color:rgba(60,40,20,.32); }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { font-family:var(--font); color:var(--ink-100); -webkit-font-smoothing:antialiased;
      background:linear-gradient(180deg,var(--dawn-600) 0%,var(--night-800) 30%,var(--night-900) 100%) fixed; }
    main { max-width:480px; margin:0 auto; padding:20px 16px 32px; }
    header { display:flex; align-items:center; gap:10px; }
    header img { width:36px; height:36px; border-radius:10px; }
    h1 { font-size:24px; font-weight:900; margin:0; }
    .back { display:inline-flex; align-items:center; gap:6px; background:none; border:1px solid var(--line); color:var(--ink-100);
      border-radius:var(--radius-pill); padding:8px 14px 8px 10px; font-size:15px; font-weight:800; text-decoration:none; margin-bottom:14px; }
    .back:hover { background:rgba(255,255,255,.07); }
    .sub { color:var(--ink-300); font-size:14px; margin:6px 0 14px; }
    button { font-family:var(--font); cursor:pointer; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline:3px solid var(--sun-500); outline-offset:3px; }
    .card { background:var(--night-800); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:12px; }
    .card p { margin:0 0 10px; font-size:14px; color:var(--ink-300); }
    label { display:block; font-size:15px; font-weight:700; margin-bottom:8px; }
    input { width:100%; font-family:var(--font); font-size:17px; color:var(--ink-100); background:rgba(255,255,255,.06);
      border:1px solid var(--line); border-radius:12px; padding:12px 14px; color-scheme:dark; }
    .row { display:flex; gap:8px; margin-top:8px; }
    .btn { width:100%; border:0; border-radius:var(--radius-pill); padding:13px 16px; font-size:17px; font-weight:800; margin-top:12px; }
    .btn-primary { background:linear-gradient(180deg,var(--sun-500),var(--sun-600)); color:var(--ink-on-sun); }
    .btn-secondary { background:transparent; color:var(--ink-100); border:1px solid rgba(255,255,255,.32); margin-top:0; }
    .list { display:grid; gap:10px; margin-top:16px; }
    .item { background:var(--night-800); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 14px; display:flex; align-items:center; gap:12px; }
    .item.done { opacity:.6; }
    .item .meta { color:var(--ink-500); font-size:13px; font-weight:700; }
    .item .main { font-size:17px; font-weight:700; }
    .item button { margin-left:auto; background:none; border:1px solid var(--line); color:var(--ink-300); border-radius:10px; padding:6px 12px; font-weight:700; }
    .empty { color:var(--ink-500); text-align:center; padding:18px; }
    .toast { position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:5; width:min(92vw,420px);
      background:var(--sun-500); color:var(--ink-on-sun); border-radius:var(--radius-md); padding:14px 16px;
      box-shadow:0 14px 34px rgba(0,0,0,.4); display:flex; gap:12px; align-items:center; font-weight:700; }
    .toast button { margin-left:auto; border:0; border-radius:var(--radius-pill); padding:8px 14px; background:var(--night-900); color:var(--ink-100); font-weight:800; }
  </style>
</head>
<body>
<main>
  <a class="back" id="back-btn" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Back to Arise</a>
  <header>
    <img src="assets/icons/icon-192.png" alt="" />
    <h1>Reminders</h1>
  </header>
  <p class="sub">Keep this small window open and reminders pop up at their time. Same list as the Arise app.</p>

  <div class="card" id="notif-card" hidden>
    <p id="notif-text">Allow pop-ups so a reminder shows even when this window is behind others.</p>
    <button class="btn btn-secondary" id="notif-btn" type="button">Allow reminder pop-ups</button>
  </div>

  <form id="add-form" class="card">
    <label for="rem-text">New reminder</label>
    <input type="text" id="rem-text" maxlength="80" placeholder="e.g. Call the bank" />
    <div class="row"><input type="date" id="rem-date" aria-label="Date" /><input type="time" id="rem-time" aria-label="Time" /></div>
    <button class="btn btn-primary" type="submit">Add reminder</button>
  </form>

  <div class="list" id="rem-list" aria-live="polite"></div>
</main>

<script>
/* Arise Reminders: a stand-alone window over the same saved list as index.html
   (localStorage key 'arise-prototype-v1'). Every action re-reads the saved list
   first, so this window and the main app never overwrite each other. */
(function () {
  var STORE = 'arise-prototype-v1';
  function load() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
  function save(d) { try { localStorage.setItem(STORE, JSON.stringify(d)); } catch (e) {} }
  function pad(x) { return String(x).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtTime(t) { var p = t.split(':'), h = +p[0]; return ((h % 12) || 12) + ':' + p[1] + ' ' + (h < 12 ? 'AM' : 'PM'); }
  function fmtDate(d) { return d === iso(new Date()) ? 'Today' : new Date(d + 'T00:00').toLocaleDateString('en-CA', { weekday:'short', month:'short', day:'numeric' }); }

  function render() {
    var list = (load().reminders || []).slice().sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });
    var el = document.getElementById('rem-list');
    el.innerHTML = list.length ? '' : '<div class="empty">No reminders yet.</div>';
    list.forEach(function (r) {
      var item = document.createElement('div');
      item.className = 'item' + (r.fired ? ' done' : '');
      item.innerHTML = '<div><div class="meta"></div><div class="main"></div></div><button type="button"></button>';
      item.querySelector('.meta').textContent = fmtDate(r.date) + ' · ' + fmtTime(r.time) + (r.fired ? ' · done' : '');
      item.querySelector('.main').textContent = r.text;
      var b = item.querySelector('button');
      b.textContent = r.fired ? 'Clear' : 'Cancel';
      b.setAttribute('aria-label', b.textContent + ' ' + r.text);
      b.onclick = function () {
        var d = load(); d.reminders = (d.reminders || []).filter(function (x) { return x.id !== r.id; }); save(d); render();
      };
      el.appendChild(item);
    });
  }

  document.getElementById('rem-date').value = iso(new Date());
  document.getElementById('add-form').onsubmit = function (ev) {
    ev.preventDefault();
    var t = document.getElementById('rem-text').value.trim(), d = document.getElementById('rem-date').value, tm = document.getElementById('rem-time').value;
    if (!t || !d || !tm) { document.getElementById(!t ? 'rem-text' : !tm ? 'rem-time' : 'rem-date').focus(); return; }
    var data = load(); data.reminders = data.reminders || [];
    data.reminders.push({ id: Date.now(), text: t, date: d, time: tm }); save(data);
    document.getElementById('rem-text').value = ''; document.getElementById('rem-time').value = '';
    askNotify(); render();
  };

  // ---------- Pop-ups ----------
  var canNotify = 'Notification' in window;
  function renderNotifCard() {
    var card = document.getElementById('notif-card'), txt = document.getElementById('notif-text'), btn = document.getElementById('notif-btn');
    if (!canNotify) { card.hidden = false; btn.hidden = true; txt.textContent = 'This browser shows reminders only inside this window while it is open.'; return; }
    card.hidden = Notification.permission === 'granted';
    if (Notification.permission === 'denied') { btn.hidden = true; txt.textContent = 'Pop-ups are blocked for this site, so reminders show only inside this window. To allow them, use the lock icon next to the address bar.'; }
  }
  function askNotify() { if (canNotify && Notification.permission === 'default') Notification.requestPermission().then(renderNotifCard); }
  document.getElementById('notif-btn').onclick = askNotify;

  function chime() {
    try {
      var ac = new (window.AudioContext || window.webkitAudioContext)();
      [660, 880].forEach(function (f, i) {
        var o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * 0.25;
        o.frequency.value = f; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
        o.start(t0); o.stop(t0 + 0.65);
      });
    } catch (e) {}
  }
  function fire(r) {
    if (canNotify && Notification.permission === 'granted') {
      try {
        var n = new Notification('Arise reminder', { body: r.text, icon: 'assets/icons/icon-192.png', tag: 'arise-rem-' + r.id });
        n.onclick = function () { window.focus(); n.close(); };
      } catch (e) {}
    }
    var el = document.createElement('div');
    el.className = 'toast'; el.setAttribute('role', 'alert');
    el.innerHTML = '<span aria-hidden="true">🔔</span><span class="t"></span><button type="button">OK</button>';
    el.querySelector('.t').textContent = r.text;
    el.querySelector('button').onclick = function () { el.remove(); };
    document.body.appendChild(el);
    chime();
  }
  function check() {
    var data = load(), now = Date.now(), due = [];
    (data.reminders || []).forEach(function (r) {
      var at = new Date(r.date + 'T' + r.time).getTime();
      if (!r.fired && at <= now && now - at < 12 * 3600e3) { r.fired = true; due.push(r); }
    });
    if (!due.length) return;
    save(data); // mark first, so the main app (if open too) does not pop the same one
    due.forEach(fire); render();
  }

  // Changes made in the main Arise window show up here straight away.
  window.addEventListener('storage', function (e) { if (e.key === STORE) render(); });
  setInterval(check, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  // Back: if Arise opened this as a small window, close it and return to Arise;
  // otherwise go back to Arise in this same tab (never a new one).
  document.getElementById('back-btn').onclick = function (ev) {
    if (window.opener && !window.opener.closed) {
      ev.preventDefault();
      try { window.opener.focus(); } catch (e) {}
      window.close();
    }
  };
  render(); renderNotifCard(); check();
})();
</script>
</body>
</html>
