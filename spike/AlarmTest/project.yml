name: AlarmTest
options:
  bundleIdPrefix: com.nezeville.arise
  deploymentTarget:
    iOS: "26.1"
targets:
  AlarmTest:
    type: application
    platform: iOS
    sources:
      - path: AlarmTest
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nezeville.arise.alarmtest
        PRODUCT_NAME: Arise Alarm Test
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W6V9R9C5KX
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: AlarmTest/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Alarm Test"
